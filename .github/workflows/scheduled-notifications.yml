name: Scheduled Iponly notifications

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  dispatch:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger scheduled notification delivery
        env:
          APP_URL: ${{ secrets.IPONLY_APP_URL }}
          CRON_SECRET: ${{ secrets.IPONLY_NOTIFICATION_CRON_SECRET }}
        run: |
          if [ -z "$APP_URL" ] || [ -z "$CRON_SECRET" ]; then
            echo "Configure IPONLY_APP_URL and IPONLY_NOTIFICATION_CRON_SECRET repository secrets."
            exit 1
          fi

          curl --fail-with-body --silent --show-error --max-time 60 \
            "${APP_URL%/}/api/cron/notifications" \
            --header "Authorization: Bearer ${CRON_SECRET}"
