<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#f3f6f1">
    <title>You're offline | Iponly</title>
    <style>
      :root { color-scheme: light; font-family: system-ui, sans-serif; background: #f3f6f1; color: #192821; }
      body { box-sizing: border-box; display: grid; min-height: 100vh; margin: 0; padding: 24px; place-items: center; }
      main { width: min(100%, 440px); padding: 32px; border: 1px solid #e3e9e3; border-radius: 24px; background: #fff; box-shadow: 0 10px 34px rgb(34 61 47 / 5%); }
      h1 { margin: 0 0 12px; font-size: 1.75rem; }
      p { color: #52635a; line-height: 1.6; }
      a { display: inline-flex; min-height: 44px; align-items: center; margin-top: 12px; padding: 0 18px; border-radius: 999px; background: #187550; color: #fff; font-weight: 700; text-decoration: none; }
      a:focus-visible { outline: 3px solid #192821; outline-offset: 3px; }
    </style>
  </head>
  <body>
    <main>
      <h1>You’re offline.</h1>
      <p>Some Iponly features need an internet connection. Reconnect to view the latest financial information or save changes.</p>
      <a href="/">Try again</a>
    </main>
  </body>
</html>
